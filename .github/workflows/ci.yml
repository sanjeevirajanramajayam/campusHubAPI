name: CampusHub CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'CampusHub_Postman_Collection.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'CampusHub_Postman_Collection.json'

# Concurrency: Cancel stale in-progress runs for the same branch to conserve runner compute minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Security Audit, Linting, Typecheck & Production Build
  # ========================================================
  quality-check:
    name: Code Quality, Security & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 🛡️ DevSecOps: Security Audit for High/Critical Vulnerabilities
      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      # 🎨 Code Formatting Guard: Prettier Check
      - name: Code Formatting Check (Prettier)
        run: pnpm format:check

      # 🔍 Static Code Analysis: ESLint 9 AST Inspection
      - name: Code Quality & Linter (ESLint)
        run: pnpm lint

      # 🗄️ Database Schema Verification: Prisma
      - name: Validate Prisma Schema
        run: pnpm prisma validate

      # ⚡ Type Safety: Strict TypeScript Compiler
      - name: TypeScript Typecheck (Zero Tolerance)
        run: pnpm typecheck

      # 📦 Bundler: Compile Production JavaScript Bundle
      - name: Compile Production JavaScript Bundle
        run: pnpm build

  # ========================================================
  # JOB 2: Containerization & Docker Image Build
  # ========================================================
  docker-build:
    name: Build & Verify Production Docker Image
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Test compilation; deployment triggered via Render Blueprint
          tags: campushub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
