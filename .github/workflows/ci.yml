name: CampusHub CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Concurrency: Cancel in-progress runs for the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Linting, Typecheck, Schema Validation & Build
  # ========================================================
  quality-check:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm prisma validate

      - name: TypeScript Typecheck (Zero Tolerance)
        run: pnpm typecheck

      - name: Compile Production JavaScript Bundle
        run: pnpm build

  # ========================================================
  # JOB 2: Containerization & Docker Image Build
  # ========================================================
  docker-build:
    name: Build & Verify Docker Image
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Only test compilation; push when deploying to cloud registry
          tags: campushub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
