name: CampusHub Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Security Audit, Linting, Typecheck, Tests & Coverage
  # ========================================================
  quality-check:
    name: Code Quality, Security & Test Coverage Gate
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      JWT_ACCESS_SECRET: supersecretjwtaccesstokenkey2026forciandtestsenvironments
      JWT_REFRESH_SECRET: supersecretjwtrefreshtokenkey2026forciandtestsenvironments
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      API_PREFIX: /api/v1

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: Code Formatting Check (Prettier)
        run: pnpm format:check

      - name: Code Quality & Linter (ESLint)
        run: pnpm lint

      - name: Validate Prisma Schema
        run: pnpm prisma validate

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: TypeScript Typecheck (Zero Tolerance)
        run: pnpm typecheck

      - name: Run Unit Tests with Code Coverage Gate
        run: pnpm vitest run tests/unit --coverage

      - name: Compile Production JavaScript Bundle
        run: pnpm build

  # ========================================================
  # JOB 2: Containerization & Docker Image Build
  # ========================================================
  docker-build:
    name: Build & Verify Production Docker Image
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: campushub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # JOB 3: Deploy to Render (ONLY When All Tests Pass)
  # ========================================================
  deploy:
    name: Deploy to Production (Render)
    needs: [quality-check, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated webhook trigger."
            echo "👉 To enable automated deploy gating: Add RENDER_DEPLOY_HOOK_URL to GitHub Repo Secrets."
          else
            echo "🚀 All tests, quality checks, and Docker builds passed! Triggering Render deployment..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deployment successfully queued!"
          fi
