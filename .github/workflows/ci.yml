name: CampusHub Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Security, Quality, Typecheck, Database & Full Tests
  # ========================================================
  quality-check:
    name: Code Quality, Security & Full Test Suite
    runs-on: ubuntu-latest

    # 🐳 Service Containers: Spin up isolated real PostgreSQL and Redis in CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: campushub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/campushub_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_ACCESS_SECRET: supersecretjwtaccesstokenkey2026forciandtestsenvironments
      JWT_REFRESH_SECRET: supersecretjwtrefreshtokenkey2026forciandtestsenvironments
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      API_PREFIX: /api/v1

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: Code Formatting Check (Prettier)
        run: pnpm format:check

      - name: Code Quality & Linter (ESLint)
        run: pnpm lint

      - name: Validate Prisma Schema
        run: pnpm prisma validate

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push Schema to CI PostgreSQL Container
        run: pnpm prisma db push --accept-data-loss

      - name: TypeScript Typecheck (Zero Tolerance)
        run: pnpm typecheck

      - name: Run Unit Tests with Coverage Gate
        run: pnpm vitest run tests/unit --coverage

      - name: Run Integration Tests (Real PostgreSQL & Redis)
        run: pnpm test:integration

      - name: Run Concurrency Race-Condition Tests (Row Locking)
        run: pnpm test:concurrency

      - name: Run Security & Auth Tampering Tests
        run: pnpm test:security

      - name: Compile Production JavaScript Bundle
        run: pnpm build

  # ========================================================
  # JOB 2: Containerization & Docker Image Build
  # ========================================================
  docker-build:
    name: Build & Verify Production Docker Image
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: campushub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # JOB 3: Deploy to Render (ONLY When All Tests Pass)
  # ========================================================
  deploy:
    name: Deploy to Production (Render)
    needs: [quality-check, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated webhook trigger."
            echo "👉 To enable automated deploy gating: Add RENDER_DEPLOY_HOOK_URL to GitHub Repo Secrets."
          else
            echo "🚀 All tests, quality checks, and Docker builds passed! Triggering Render deployment..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deployment successfully queued!"
          fi
