services:
  # ========================================================
  # 1. API Web Service (Built from our multi-stage Dockerfile)
  # ========================================================
  - type: web
    name: campushub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    # Automatically apply Prisma database schema before launching new container
    preDeployCommand: npx prisma db push --accept-data-loss

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: '*'

      # Automatically bind to the PostgreSQL database defined below
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString

      # Redis Configuration (Can point to Render Redis or Free Upstash Redis)
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379

      # Render generates cryptographically secure 256-bit secrets automatically
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

# ========================================================
# 2. Managed PostgreSQL Database (Free Tier)
# ========================================================
databases:
  - name: campushub-db
    plan: free
    region: oregon
    databaseName: campushub_prod
    user: campushub_admin
