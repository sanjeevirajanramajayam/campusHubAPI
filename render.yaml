services:
  # ========================================================
  # 1. API Web Service (Express 5 REST API + SSE)
  # ========================================================
  - type: web
    name: campushub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: '*'

      # Automatically bind to the PostgreSQL database defined below
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString

      # Redis Configuration
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379

      # Cryptographically secure 256-bit secrets
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ========================================================
  # 2. Frontend Web Service (Next.js 16 Brutalist Client)
  # ========================================================
  - type: web
    name: campushub-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Route server-side proxy requests to public backend URL
      - key: BACKEND_INTERNAL_URL
        value: https://campushub-api.onrender.com

# ========================================================
# 3. Managed PostgreSQL Database (Free Tier)
# ========================================================
databases:
  - name: campushub-db
    plan: free
    region: oregon
    databaseName: campushub_prod
    user: campushub_admin
